    limitations:
      - {value: Shared-kernel OS sandbox, not a microVM or full VM.}
      - {value: Network open in default code-only mode.}
      - {value: Unlocked capabilities intentionally expose the corresponding credentials to the agent.}
    compliance: {value: none_stated}

# -----------------------------------------------------------------------------
# Adjacent tools & approaches. Same claim conventions; lighter schema.
# -----------------------------------------------------------------------------
adjacent:

  - id: paseo
    name: Paseo
    role: orchestrator
    default_source: paseo_docs
    urls: {official: "https://paseo.sh/", docs: "https://paseo.sh/docs/providers"}
    thread_status: {value: directly_linked, src: hn_thread}
    summary:
      value: Local-first orchestrator for multiple coding-agent CLIs; self-hostable.
      basis: Its own docs say it doesn't ship a coding agent — it launches and supervises existing CLIs. Not itself the trust boundary.
    pairs_with: [clawk, yoloai, virtdev, exe_dev]

