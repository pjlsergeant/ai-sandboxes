# v0.2.7 change: added SandBase Harness (2026-08-31), a local-first,
# self-hosted runtime with persistent sessions, MCP/tool governance, and
# selectable Local, Docker, Kubernetes, and worker execution backends. The
# entry deliberately records backend-dependent isolation and leaves credential
# mediation unspecified where the primary docs do not define a single model.
# =============================================================================
# AI Agent Sandboxes — structured dataset (evidence-carrying edition)
#
# Derived from: "AI Sandboxes and Adjacent Approaches from the Clawk Hacker
# News Thread" (HN item 48892859) plus the official docs cited therein.
#
# v0.2.0 change: no bare ratings. Every non-identity field is a CLAIM that
# carries its evidence. Fields with no evidentiary basis were deleted
# (the v0.1 setup_burden / approval_friction / state_ergonomics scales).
#
# v0.2.1 change: primary-source audit pass (2026-07-14). Fixed stale version
# bases, wrong credential/network classifications, overclaimed agent lists,
# and promoted aide from adjacent-orchestrator to a principal sandbox entry.
#
# v0.2.2 change: added nono.sh and strongdm/leash (2026-07-20), both sourced
# from a user-submitted recommendation (private email) rather than the HN
# thread — see their thread_status fields.
#
# v0.2.3 change: full primary-source re-audit (2026-07-20), fanned out across
# parallel research agents plus an independent codex CLI cross-check (grok
# unavailable — not authenticated in this box). Fixes: added agents shipped
# since the last audit (clawk: opencode; flar, yolobox: kimi_code; agentjail
# version bump to v0.9.0 + Monitor Mode); fixed a dead instavm_coderunner blog
# link; upgraded exe_dev.credential_mediation from unspecified to
# managed_integration (Integrations docs); noted the sprites.dev -> fly.io/
# sprites redirect; corrected claude_code_sandbox's maturity (no longer beta —
# that label now belongs to a separate @anthropic-ai/sandbox-runtime package),
# added missing windows_wsl2 platform, replaced an unsupported os_keyring
# credential_mediation claim with the actual ambient/deny/mask mechanism, and
# corrected an overclaimed compliance field (ISO/IEC 42001 is aspirational
# only, no active certifications); replaced codex_sandbox's same unsupported
# os_keyring claim with unspecified; resolved nono's network-default hedge and
# noted its --env-credential fallback mode; corrected nix_opencode_with_mitm's
# overclaimed token-injection feature (aspirational in the source, not
# shipped); re-sourced wasm_substrates' container2wasm link to its own repo.
# Also fixed a pre-existing, dataset-wide YAML correctness bug: 23 inline
# flow-mapping values contained an unquoted comma, which any standards-
# compliant YAML parser (confirmed via Python's PyYAML, not just this repo's
# lenient yq) silently splits into a truncated string plus a bogus null-valued
# key — corrupting data for any real consumer, not just a display quirk.
# Quoted every affected value; verified zero remain via an automated scan.
#
# v0.2.4 change: grok CLI came back online after v0.2.3 shipped, so it ran
# the same 5-question second opinion pass codex had already done for
# claude_code_sandbox/codex_sandbox. All 5 answers matched codex and this
# dataset's edits. One refinement from grok's answer: reworded
# claude_code_sandbox.compliance so it's scoped to what the two cited
# engineering posts say, not read as "Anthropic holds no certifications
# anywhere" — Anthropic's separate Trust Center does document an actual
# SOC 2 Type II report and ISO 27001 certificate at the company level; the
# two sandboxing/containment posts just don't discuss it.
#
# v0.2.5 change: closed the agents_supported and platforms taxonomies. Both
# were free text — 31 distinct agent ids and 16 platform ids across the
# sandboxes, full of near-duplicates (claude/claude_code/claude_code_cited;
# gemini/gemini_cli; macos/macos_cloud/macos_apple_silicon; wsl/windows_wsl2)
# that made the site's facet filters noisy rather than useful. Added closed
# `taxonomy.agents_supported` (21 ids) and `taxonomy.platforms` (11 ids) lists
# and migrated every sandbox entry onto them. Nowhere was data silently
# dropped: any nuance an old id used to carry alone (virtdev's
# claude_code_cited meaning "mentioned in passing, not a real integration";
# instavm_coderunner's macos_apple_silicon meaning "Apple Silicon only, not
# Intel") now lives explicitly in that field's basis text instead.
#
# v0.2.6 change: added three sandboxes entries (2026-07-20). Greywall
# (GreyhavenHQ) -- container-free deny-by-default OS sandbox (bubblewrap/
# Landlock/seccomp/eBPF + kernel-level TUN network capture on Linux, Seatbelt
# on macOS) with host-side credential substitution; user-submitted
# recommendation. Fence (fencesandbox, formerly Use-Tusk) -- the lighter-weight
# sandbox Greywall's authors evaluated and moved away from, added while
# investigating that history; default network policy turned out to be
# kernel-enforced on both platforms (not cooperation-dependent, as first
# assumed), but credentials stay ambient -- no substitution mechanism.
# Omnigent/Omnibox (Databricks) -- OS-sandbox feature bundled inside an
# open-source multi-agent meta-harness (classified runtime_feature, not a
# standalone tool); its Windows backend turned out to provide only
# process-tree kill-on-close, not the CPU/memory ceilings its own docs
# describe. All three: ships profiles/integrations for several agents with no
# id in the closed agents_supported taxonomy (Amp, Cline, Kilo, Auggie, Droid,
# Crush, Kiro) -- recorded in each entry's basis text rather than growing that
# taxonomy per-agent, a deliberate call not to chase every individual agent
# id. A fourth candidate (XaresAICoder, a self-hosted browser IDE bundling
# several agent CLIs) was investigated and deliberately left out: real,
# actively maintained project, but a generic dev-environment container (like
# github_codespaces) rather than a boundary purpose-built around an agent's
# threat model -- no default egress policy, no credential mediation, and
# seccomp explicitly disabled for debugger compatibility.
# =============================================================================

meta:
  title: AI Agent Sandboxes & Adjacent Approaches
  version: "0.2.7"
  generated: "2026-07-14"
  updated: "2026-08-31"
  primary_thread:
    title: "Show HN: Clawk – Give coding agents a disposable Linux VM, not your laptop"
    url: "https://news.ycombinator.com/item?id=48892859"

  evidence_levels:
    official: Stated in the product's own docs, README, or vendor engineering posts.
    thread: Asserted by commenters in the HN thread; not vendor-confirmed.
    editorial: Inference by the dataset authors; must show its basis.

  conventions: >-
    Any classification/risk/cost/convenience field is either a plain
    scalar/list (SHORTHAND) or a CLAIM OBJECT. Shorthand means evidence level
    "official", sourced from the entry's default_source. Claim objects have
    keys {value, ev, src, basis, derived_from}; ev defaults to official and
    src defaults to default_source when omitted. Every ev: editorial claim
    MUST carry a basis and, where applicable, derived_from listing the
    documented fields it was inferred from. A renderer's "official claims
    only" toggle hides any claim whose effective ev is not official.
    The literal string "unspecified" means primary sources were silent —
    render it as a visible badge, never a blank cell.

# -----------------------------------------------------------------------------
# Taxonomy — closed vocabularies for filterable facets.
# (v0.1's editorial cost/convenience ordinal scales are gone; only facets that
# can be grounded in documentation remain.)
# -----------------------------------------------------------------------------
taxonomy:
  product_role:
    - {id: runtime, label: Sandbox runtime, description: Directly creates and owns the execution boundary.}
    - {id: runtime_feature, label: Built-in sandbox feature, description: Sandboxing shipped inside a larger agent product.}
    - {id: policy_wrapper, label: Policy wrapper, description: Intercepts or supervises another runtime's tool calls.}
    - {id: remote_workspace, label: Remote workspace, description: Hosted dev environment usable as an agent sandbox.}
    - {id: orchestrator, label: Orchestrator, description: Launches or supervises agents; not itself the trust boundary.}
    - {id: template, label: Template / recipe, description: Reusable setup pattern built on other substrates.}
    - {id: pattern, label: DIY pattern, description: An approach, not a product.}

  execution_locus:
    - {id: local, label: Local (user's machine)}
    - {id: self_hosted_remote, label: Self-hosted remote}
    - {id: vendor_cloud, label: Vendor-managed cloud}
    - {id: hybrid, label: Hybrid local + cloud}

  isolation_boundary:
    # Ordered weakest -> strongest always-on boundary. `strength` lets the UI
    # derive footprint/credibility framing from the documented boundary itself
    # instead of storing per-entry editorial ratings.
    - {id: user, label: Separate OS user, strength: 1}
    - {id: os_sandbox, label: OS sandbox (Seatbelt / Bubblewrap / seccomp), strength: 2}
    - {id: container, label: Container / namespace, strength: 3}
    - {id: microvm, label: MicroVM (Firecracker / QEMU microVM / Apple container), strength: 4}
    - {id: vm, label: Full VM (KVM / QEMU / hypervisor), strength: 5}
    - {id: layered, label: Layered (multiple essential boundaries), strength: null}

  state_model:
    - {id: ephemeral, label: Ephemeral — resets by design}
    - {id: resumable, label: Resumable — sessions/snapshots survive}
    - {id: persistent, label: Persistent — disks/volumes survive indefinitely}
    - {id: copy_apply, label: Copy/diff/apply — changes staged in a clone}
    - {id: configurable, label: Configurable per mode}

  network_policy:
    - {id: open, label: Open outbound by default}
    - {id: allowlist, label: Outbound allowlist}
    - {id: proxy_mediated, label: Inspecting / mediating proxy}
    - {id: none, label: No network}
    - {id: operator_managed, label: Operator/vendor-managed policy}
    - {id: configurable, label: Configurable (open/allowlist/none modes)}

  credential_mediation:
    - {id: ambient, label: Ambient — host env visible to agent}
    - {id: mounted, label: Mounted — secret present inside runtime as file/env}
    - {id: forwarded, label: Forwarded — e.g. SSH agent socket, key stays off-guest}
    - {id: host_side_injection, label: Host-side injection — secret added only on egress}
    - {id: os_keyring, label: OS keyring — agent auth in system keychain}
    - {id: managed_integration, label: Managed integration — vendor service connector}
    - {id: unspecified, label: Unspecified in primary sources}

  threat_tier:
    - id: t1_accidents
      label: Accidents
      description: Agent runs a destructive command in the wrong place.
    - id: t2_exfiltration
      label: Prompt-injection exfiltration
      description: Agent tricked into shipping secrets or data out; needs egress control and/or credential mediation.
    - id: t3_hostile_escape
      label: Hostile code escape
      description: Malicious code attempts to break the boundary; hypervisor-class isolation is the broadly credible answer.

  design_intent:
    - {id: constrain, label: Constrain the agent, description: "Check, gate, or block agent actions."}
    - {id: liberate, label: Liberate the agent, description: Build a wall so the agent can run unsupervised inside it.}
    - {id: both, label: Both / configurable}

  pricing_model:
    # Factual, documentable. Replaces v0.1's editorial cost block.
    - {id: free_oss, label: Free / open source}
    - {id: free_tier_plus_usage, label: Free tier + pay-as-you-go}
    - {id: paid_usage, label: Usage-based paid}
    - {id: paid_subscription, label: Subscription (may add usage)}
    - {id: contact_sales, label: Contact sales / pricing in flux}
    - {id: product_feature, label: Bundled feature of a paid product}
    - {id: unspecified, label: Unspecified in primary sources}

  # Closed v0.2.5 -- previously free text (31 distinct ids for agents, 16 for
  # platforms, full of near-duplicates like claude/claude_code/claude_code_cited
  # or macos/macos_cloud/macos_apple_silicon). Every entry's agents_supported
  # and platforms values now resolve to one of these ids; any nuance an old id
  # used to carry alone (e.g. "cited as an example, not a first-class
  # integration") now lives in that field's basis text instead.
  agents_supported:
    - {id: claude_code, label: Claude Code}
    - {id: codex, label: Codex CLI}
    - {id: gemini_cli, label: Gemini CLI}
    - {id: copilot, label: GitHub Copilot}
    - {id: cursor, label: Cursor}
    - {id: aider, label: Aider}
    - {id: opencode, label: OpenCode}
    - {id: pi, label: Pi}
    - {id: qwen_code, label: Qwen Code}
    - {id: grok, label: Grok}
    - {id: goose, label: Goose}
    - {id: antigravity, label: Antigravity}
    - {id: openclaw, label: OpenClaw}
    - {id: hermes, label: Hermes}
    - {id: reasonix, label: Reasonix}
    - {id: kimi_code, label: Kimi Code}
    - {id: shelley, label: Shelley (web agent)}
    - {id: moltbot, label: Moltbot (Clawdbot)}
    - {id: mcp_orchestrated, label: MCP-orchestrated agents (generic), description: Named as supporting agents driven via MCP rather than a specific product.}
    - {id: generic_command_execution, label: Generic command execution, description: Runs arbitrary shell commands; not tied to any named agent.}
    - {id: agent_agnostic, label: Any agent (agent-agnostic), description: "Stated to work with whatever agent you point at it, without naming specific ones."}

  # Platforms conflates host OS with access method by design of the source
  # data (e.g. exe.dev and Fly Sprites are fully remote, so "platform" means
  # how you reach them, not an OS) -- rather than force a schema split, this
  # stays one closed list, disambiguated by label. Hosting/locus (local vs.
  # vendor-cloud) is already classification.execution_locus's job, so the old
  # macos_cloud/linux_cloud/arch_linux_host/macos_apple_silicon ids collapse
  # to their base OS here, with any real constraint (Arch specifically,
  # Apple Silicon specifically) kept in that entry's platforms basis.
  platforms:
    - {id: macos, label: macOS}
    - {id: linux, label: Linux}
    - {id: windows_wsl2, label: Windows (WSL2)}
    - {id: windows_powershell, label: Windows (native, PowerShell)}
    - {id: cloud, label: Cloud (hosted execution mode)}
    - {id: browser, label: Browser}
    - {id: vscode, label: VS Code}
    - {id: cli, label: CLI}
    - {id: api, label: API}
    - {id: sdk, label: SDK}
    - {id: ssh, label: SSH}

