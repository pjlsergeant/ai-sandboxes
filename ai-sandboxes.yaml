      basis: Site states it "sandboxes any terminal agent" and names these explicitly.
    classification:
      role: runtime
      execution_locus: local
      isolation_boundary:
        value: os_sandbox
        basis: README states "no daemon, no container, no VM, and no disk space usage"; uses Linux Landlock layered with seccomp-notify, and Apple's Seatbelt sandbox on macOS.
