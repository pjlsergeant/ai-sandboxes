# -----------------------------------------------------------------------------
# Source stack — priority ordering for the site's evidence links.
# -----------------------------------------------------------------------------
source_stack:
  - {priority: highest, kind: official_product_docs_and_readmes, why: "Where execution model, network policy, persistence, and integrations are actually documented."}
  - priority: very_high
    kind: vendor_containment_engineering_posts
    examples: [anthropic_containment, anthropic_sandboxing, codex_security]
    why: Best primary material on agent threat models and why sandboxing needs approvals plus network control.
  - {priority: high, kind: official_pricing_and_service_docs, why: Required for real cost comparison of managed offerings.}
  - {priority: high, kind: official_api_and_integration_docs, why: Integration surface is a major differentiator.}
  - {priority: medium, kind: repo_security_model_docs, why: "Often contain the best limitations language, especially for OSS tools."}
  - {priority: medium, kind: hn_thread, ref: hn_thread, why: "Discovery, adjacent approaches, and what practitioners think is missing."}
