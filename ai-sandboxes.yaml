# -----------------------------------------------------------------------------
# UI hints. The decision funnel keys off documented fields only.
# -----------------------------------------------------------------------------
ui:
  primary_filters: [classification.isolation_boundary, classification.execution_locus,
                    classification.network_policy, classification.credential_mediation,
                    pricing.model, agents_supported, platforms]
  compare_view_row_order:
    - classification.isolation_boundary
    - classification.network_policy
    - classification.credential_mediation
    - classification.state_model
    - risk.stated_scope
    - risk.assessed_tiers
    - pricing.model
    - maturity
    - limitations
  evidence_rendering:
    official: plain text, source-linked
    thread: chip labeled "per HN commenters", source-linked
    editorial: chip labeled "our assessment", basis shown on hover/expand
    toggle_official_only: hide any claim whose effective ev != official
  decision_funnel:
    - question: What are you afraid of?
      maps_to: [risk.stated_scope, risk.assessed_tiers, classification.isolation_boundary]
      effect: Sets the minimum acceptable boundary strength (taxonomy.isolation_boundary.strength).
    - question: What will it cost you, in money and machine?
      maps_to: [pricing, classification.isolation_boundary, footprint_notes]
      effect: Boundary strength implies local footprint; pricing.model covers the monetary side.
    - question: Where must code run?
      maps_to: classification.execution_locus
      effect: Local ownership vs off-laptop persistence and concurrency.

# -----------------------------------------------------------------------------
# Principal sandboxes. Shorthand scalar = {ev: official, src: default_source}.
# -----------------------------------------------------------------------------
sandboxes:

  - id: clawk
    name: Clawk
    default_source: clawk_repo
    tagline: Disposable, network-restricted Linux VMs for coding agents.
    urls: {repo: "https://github.com/clawkwork/clawk"}
    license: Apache-2.0
    maturity: {value: pre_1_0_active, basis: Repo is pre-1.0 and under active development.}
    thread_status: {value: directly_linked, src: hn_thread}
    platforms:
      value: [macos, linux]
      basis: macOS first-class; Linux provider explicitly experimental.
    agents_supported: [claude_code, codex, generic_shell]
    classification:
      role: runtime
      execution_locus: local
      isolation_boundary: {value: vm, basis: Hypervisor-backed Linux guest per repo or multi-repo worktree.}
      state_model: {value: resumable, basis: VM disk disposable except snapshots; Linux provider adds disk persistence; repo and conversations live on host.}
      network_policy: {value: allowlist, basis: Outbound allowlist documented in README.}
      credential_mediation: {value: forwarded, basis: SSH-agent forwarding keeps private keys off the guest.}
    risk:
      stated_scope:
        value: [t1_accidents, t2_exfiltration, t3_hostile_escape]
        basis: README claims center on the VM boundary plus network allowlist, while stating that anything mounted or allowlisted is exposed to the agent.
      assessed_tiers:
        value: [t1_accidents, t2_exfiltration, t3_hostile_escape]
        ev: editorial
        derived_from: [classification.isolation_boundary, classification.network_policy, classification.credential_mediation]
        basis: Hypervisor boundary (official) + egress allowlist (official) + off-guest keys (official) plausibly cover all three tiers; no independent audit exists.
      design_intent:
        value: liberate
        basis: Product framing is giving agents a disposable VM instead of your laptop.
    pricing: {model: free_oss}
    footprint_notes:
      value: One VM per repo or multi-repo worktree.
      basis: Documented deployment unit; RAM/disk implications follow from the VM boundary, not from a stored rating.
    convenience_notes:
      - {value: Worktree workflow and ticket mode built in.}
    integrations: [oci_image_rootfs, git_worktrees, ticket_mode, cli]
    audience: [individual_developer, small_team]
    limitations:
      - {value: macOS-first; Linux path experimental.}
      - {value: Anything mounted or allowlisted is exposed to the agent.}
    compliance: {value: none_stated}

  - id: agentjail
    name: agentjail
    default_source: agentjail_repo
    tagline: Policy guardrails that check every agent tool call before it runs.
    urls: {repo: "https://github.com/LuD1161/agentjail"}
    license: Apache-2.0
    maturity: {value: early_active, basis: v0.8.2 released July 2026; still pre-1.0 and shipping rapidly.}
    thread_status: {value: directly_linked, src: hn_thread}
    platforms: [macos, linux]
    agents_supported: [claude_code, codex, cursor]
    classification:
      role: policy_wrapper
      execution_locus: local
      isolation_boundary: {value: os_sandbox, basis: Hook-based policy checks with optional kernel sandbox (agentjail-shield).}
      state_model: {value: resumable, basis: Per-project overlays and sessions; policies and daemon on host.}
      network_policy: {value: proxy_mediated, basis: Session-aware net proxy; opt-in / interim in some flows.}
      credential_mediation:
        value: host_side_injection
        basis: v0.6+ ships a credential broker and secrets vault; shield path strips ambient env; secrets role mediates access rather than leaving keys ambient in the agent environment.
    risk:
      stated_scope:
        value: [t1_accidents, t2_exfiltration]
        basis: README frames the goal as preventing unsafe tool calls before they run, with a fail-closed policy posture and defense in depth; it does not claim a VM boundary.
      assessed_tiers:
        value: [t1_accidents, t2_exfiltration]
        ev: editorial
        derived_from: [classification.isolation_boundary, classification.network_policy, classification.credential_mediation]
        basis: Policy + OS sandbox + proxy + credential broker address accidents and exfiltration; hostile escape is out of scope without a hypervisor boundary.
      design_intent:
        value: constrain
        basis: Every tool call is checked locally before it runs, per the repo description.
    pricing: {model: free_oss}
    footprint_notes:
      value: Runs as hooks and a host daemon; no VM or container required.
      basis: Documented architecture.
    convenience_notes:
      - {value: Stated goal includes reducing approval fatigue.}
    integrations: [hooks, opa_policies, mcp_scan, daemon, net_proxy_opt_in, secrets_broker]
    audience: [individual_developer]
    limitations:
      - {value: Not a full VM.}
      - {value: Proxy path interim / opt-in in some flows.}
    compliance: {value: none_stated}

  - id: gondolin
    name: Gondolin
    default_source: gondolin_docs
    tagline: Local microVMs with a programmable (TypeScript) network and filesystem policy layer.
    urls: {repo: "https://github.com/earendil-works/gondolin", docs: "https://earendil-works.github.io/gondolin/", security: "https://github.com/earendil-works/gondolin/security"}
    license: {value: Apache-2.0, src: gondolin_repo}
    maturity: {value: experimental_active, src: gondolin_repo, basis: Self-described as experimental; @earendil-works/gondolin package at v0.12.0 as of mid-2026.}
    thread_status: {value: directly_linked, src: hn_thread}
    platforms: [macos, linux]
    agents_supported: [generic_command_execution, pi_extension]
    classification:
      role: runtime
      execution_locus: local
      isolation_boundary: {value: microvm, basis: QEMU microVM by default; experimental libkrun backend.}
      state_model: {value: configurable, basis: Copy-on-write root disk; persistence governed by host-side VFS policy; custom images optional.}
      network_policy: {value: proxy_mediated, basis: Host-side JS network stack mediates traffic; allowlisting expressible in the policy layer.}
      credential_mediation: {value: host_side_injection, src: gondolin_repo, basis: Guest sees only a placeholder token; host injects the real secret solely for allowed destinations.}
    risk:
      stated_scope:
        value: [t1_accidents, t2_exfiltration, t3_hostile_escape]
        src: gondolin_security
        basis: Security design doc states an explicit threat model, and explicitly trusts the host Node process and QEMU boundary, with no full DoS isolation.
      assessed_tiers:
        value: [t1_accidents, t2_exfiltration, t3_hostile_escape]
        ev: editorial
        derived_from: [classification.isolation_boundary, classification.network_policy, classification.credential_mediation]
        basis: MicroVM boundary + mediated egress + host-side secret injection cover all three tiers within the stated trust assumptions.
      design_intent:
        value: both
        ev: editorial
        basis: Programmable policy layer supports both gating (constrain) and walled autonomy (liberate); docs do not pick a side.
    pricing: {model: free_oss}
    footprint_notes:
      value: MicroVM per sandbox with copy-on-write root disk.
      basis: Documented architecture.
    convenience_notes:
      - {value: Early-stage ergonomics acknowledged in its own docs.}
    integrations: [typescript_policy_layer, vfs_providers, custom_images, pi_extension]
    audience: [platform_builder, individual_developer]
    limitations:
      - {value: Trusts host Node process and QEMU boundary., src: gondolin_security}
      - {value: No full DoS isolation., src: gondolin_security}
    compliance: {value: none_stated}

  - id: flar
    name: flar
    default_source: flar_repo
    tagline: Fast, light Bubblewrap-based agent restriction with minimal startup overhead.
    urls: {repo: "https://github.com/swelljoe/flar"}
    license: Apache-2.0
    maturity: {value: very_early, basis: No published releases at fetch time, per its own README.}
    thread_status: {value: directly_linked, src: hn_thread}
    platforms: [linux]
    agents_supported: [claude_code, antigravity, codex, copilot, reasonix]
    classification:
      role: runtime
      execution_locus: local
      isolation_boundary: {value: os_sandbox, basis: Bubblewrap in an unprivileged user namespace; read-only system paths; project bind mount.}
      state_model: {value: resumable, basis: Temporary copied config plus bound per-project transcript stores; host config untouched.}
      network_policy: {value: configurable, basis: Isolated by default with optional host/shared network.}
      credential_mediation: {value: mounted, basis: Config is copied in; the chosen agent's credential token remains accessible to that agent.}
    risk:
      stated_scope:
        value: [t1_accidents]
        basis: README markets tighter-than-in-agent sandboxing but is candid that the project is far less tested and that the agent's own token stays reachable.
      assessed_tiers:
        value: [t1_accidents]
        ev: editorial
        derived_from: [classification.credential_mediation, classification.isolation_boundary]
        basis: In-runtime token access undermines the exfiltration tier; OS-sandbox boundary is below hypervisor grade.
      design_intent:
        value: constrain
        basis: A restrictor by name and framing.
    pricing: {model: free_oss}
    footprint_notes:
      value: Namespace-based; minimal startup overhead is the stated point of the project.
      basis: README framing (Fast Light Agent Restrictor).
    convenience_notes:
      - {value: Session seeding / shadow homes; host-side proxy.}
    integrations: [host_side_proxy, config_copying, session_seeding_shadow_homes]
    audience: [individual_developer]
    limitations:
      - {value: Linux-only.}
      - {value: Far less tested, per its own README; no releases at fetch time.}
      - {value: Agent's own credential token reachable by that agent.}
    compliance: {value: none_stated}

  - id: yoloai
    name: yoloAI
    default_source: yoloai_repo
    tagline: One sandbox wrapper across many backends, with a copy/diff/apply review workflow.
    urls: {repo: "https://github.com/kstenerud/yoloai"}
    license: MIT
    maturity: {value: public_beta}
    thread_status: {value: directly_linked, src: hn_thread}
    platforms: [linux, macos, windows_wsl2]
    agents_supported: [claude, codex, gemini_cli, aider, opencode, generic_shell]
    classification:
      role: runtime
      execution_locus: local
      isolation_boundary:
        value: layered
        basis: Backends span Docker, Podman, containerd/Kata, Apple container, Tart, Seatbelt; isolation modes from namespaces through gVisor to Kata/Firecracker.
      state_model: {value: copy_apply, basis: Sandbox changes are reviewed with diff and applied; state lives in ~/.yoloai/.}
      network_policy: {value: configurable, basis: Documented open / allowlist / none modes.}
      credential_mediation:
        value: host_side_injection
        basis: Credential brokering documented, but provider-specific rather than universal; otherwise mounted.
    risk:
      stated_scope:
        value: [t1_accidents, t2_exfiltration]
        basis: README claims no ambient data, credential brokering, and network none/allowlist modes.
      assessed_tiers:
        value: [t1_accidents, t2_exfiltration, t3_hostile_escape]
        ev: editorial
        derived_from: [classification.isolation_boundary, classification.network_policy]
        basis: Tier credibility depends on the chosen backend — namespaces reach t1; Kata/Firecracker backends are t3-grade.
      design_intent:
        value: both
        ev: editorial
        basis: Copy/diff/apply gates changes (constrain) while backends enable walled autonomy (liberate).
    pricing: {model: free_oss}
    footprint_notes:
      value: Footprint tracks the chosen backend, from shared-kernel namespaces to Firecracker microVMs.
      basis: Documented backend list.
    convenience_notes:
      - {value: Diff/apply adds a review step to every change in exchange for safety., ev: editorial, derived_from: [classification.state_model], basis: Direct implication of the documented copy/diff/apply workflow.}
    integrations: [go_api, mcp_bidirectional, vscode_tunnel, profiles, extensions]
    audience: [individual_developer]
    limitations:
      - {value: Complexity from many backends., ev: thread, src: hn_thread}
      - {value: Credential brokering not universal across providers.}
    compliance: {value: none_stated}

  - id: virtdev
    name: virtdev
    default_source: virtdev_repo
    tagline: Per-project Arch Linux KVM/QEMU VMs with nftables egress zones.
    urls: {repo: "https://github.com/matheusmoreira/virtdev"}
    license: AGPL-3.0
    maturity: {value: active_personal_project}
    thread_status: {value: directly_linked, src: hn_thread}
    platforms: {value: [arch_linux_host], basis: Requires an Arch Linux host.}
    agents_supported: [agent_agnostic, claude_code_cited]
    classification:
      role: runtime
      execution_locus: local
      isolation_boundary: {value: vm, basis: KVM/QEMU virtual machines, locked by default.}
      state_model: {value: persistent, basis: Shared sealed base image with per-project qcow2 deltas.}
      network_policy: {value: configurable, basis: nftables egress zones via passt — none/wan/lan/full plus optional custom single-port holes; default zone is none (no network beyond SSH).}
      credential_mediation: unspecified
    risk:
      stated_scope:
        value: [t1_accidents, t3_hostile_escape]
        basis: Security focus documented as hypervisor boundary plus egress zones; no built-in policy engine or secret injection yet.
      assessed_tiers:
        value: [t1_accidents, t3_hostile_escape]
        ev: editorial
        derived_from: [classification.isolation_boundary, classification.network_policy, classification.credential_mediation]
        basis: Hypervisor boundary and zoning are strong, but with credential handling unspecified, exfiltration protection depends entirely on what the user places in the VM and which zone they choose.
      design_intent:
        value: liberate
        ev: editorial
        basis: Walled per-project VMs for autonomous work; no per-call gating layer.
    pricing: {model: free_oss}
    footprint_notes:
      value: Full VM per project, deduplicated via a shared sealed base plus qcow2 deltas.
      basis: Documented storage architecture.
    convenience_notes:
      - {value: Root needed at least once to apply the firewall.}
    integrations: [cli, custom_zones, user_mode_systemd]
    audience: [linux_power_user]
    limitations:
      - {value: Arch-host requirement.}
      - {value: Credential injection not yet built in.}
    compliance: {value: none_stated}

  - id: exe_dev
    name: exe.dev
    default_source: exe_dev_site
    tagline: Hosted persistent Linux VMs that keep working when your laptop is closed.
    urls: {official: "https://exe.dev/", pricing: "https://exe.dev/pricing", blog: "https://blog.exe.dev/meet-exe.dev"}
