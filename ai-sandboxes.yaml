  - id: claude_code_sandbox
    name: Claude Code sandbox
    default_source: claude_code_sandbox_docs
    tagline: OS-native sandboxing built into Claude Code for safer autonomy with fewer prompts.
    urls: {docs: "https://code.claude.com/docs/en/sandboxing", engineering: "https://www.anthropic.com/engineering/claude-code-sandboxing", containment: "https://www.anthropic.com/engineering/how-we-contain-claude"}
    license: product_feature
    maturity:
      value: mature_no_beta_label
      ev: editorial
      basis: "As of 2026-07-20, the current canonical docs (code.claude.com/docs/en/sandboxing) no longer label the built-in sandboxed Bash tool beta or research preview; that label now applies only to the separate, standalone @anthropic-ai/sandbox-runtime package (which wraps the whole Claude Code process, not just Bash). The 2026 engineering post's beta wording described that earlier, narrower rollout. Anthropic does not explicitly call the built-in tool GA either — this is an absence of a beta label, not a confirmed GA announcement. Cross-checked independently via codex CLI, which reached the same conclusion."
    thread_status: {value: directly_linked, src: hn_thread}
    platforms: {value: [macos, linux, windows_wsl2], basis: "Seatbelt on macOS; Bubblewrap on both Linux and WSL2. WSL1 and native Windows are not supported."}
    agents_supported: [claude_code]
    classification:
      role: runtime_feature
      execution_locus: local
      isolation_boundary: {value: os_sandbox, basis: "OS-native filesystem and network sandboxing — Seatbelt on macOS, Bubblewrap on Linux and WSL2."}
      state_model: {value: persistent, basis: Local repo/workspace state persists; sandbox applies to bash commands and FS/network boundaries.}
      network_policy: {value: configurable, basis: Sandbox-configured network boundaries.}
      credential_mediation:
        value: ambient
        basis: "Sandboxed Bash commands inherit the parent process environment by default, including any credentials set there — the default read policy also still allows reading files like ~/.aws/credentials or ~/.ssh/. The optional sandbox.credentials setting can `deny` reads/unset specific env vars, or `mask` an env var behind a sentinel value that a TLS-terminating egress proxy substitutes for the real secret only on requests to allowed hosts — but neither is the default, and there is no OS keyring/keychain-based mediation of secrets by the sandbox feature itself (that mechanism does not appear in the current docs; it does not exist). Independently confirmed via codex CLI."
    risk:
      stated_scope:
        value: [t1_accidents, t2_exfiltration]
        basis: Anthropic ties sandboxing to working-directory boundaries, network controls, and reduced permission prompts.
      assessed_tiers:
        value: [t1_accidents, t2_exfiltration]
        ev: editorial
        derived_from: [classification.isolation_boundary, classification.network_policy]
        basis: "OS sandbox plus default-deny-then-prompt network controls address accidents and exfiltration; not a hypervisor boundary. Credentials are ambient by default (ambient env inheritance, deny/mask are opt-in), so this tier's credibility rests on the network boundary and user-configured sandbox.credentials rules, not on any built-in credential mediation."
      design_intent:
        value: both
        basis: Stated goal is safer autonomy with fewer permission prompts — gating and liberation together.
    pricing: {model: product_feature, notes: {value: Bundled with Claude Code; product pricing not in fetched sources.}}
    footprint_notes:
      value: OS-sandbox primitives; no VM or container overhead.
      basis: Documented mechanism.
    convenience_notes:
      - {value: "Reduces permission prompts, per Anthropic's stated design goal."}
      - {value: Zero-install for existing Claude Code users., ev: editorial, basis: It is a feature of the product the user already runs.}
    integrations: [ide_integrations, permissions_system, devcontainer_guidance, agent_sdk, managed_agents_docs]
    audience: [claude_code_users]
    compliance:
      value: not_referenced_in_these_sources_trust_center_exists_separately
      ev: editorial
      src: anthropic_containment
      basis: "Neither cited engineering post references any active trust-center certification for this specific sandbox feature (no SOC 2, ISO 27001, etc). The containment post's only certification-adjacent mention is ISO/IEC 42001, named in a forward-looking \"Looking ahead\" section as an external AI-management standard the industry should develop toward, not something claimed as already held. This is scoped to these two posts only: Anthropic does maintain a separate Trust Center (trust.anthropic.com) documenting an actual SOC 2 Type II report and ISO 27001 certificate at the company level, per code.claude.com/docs/en/security — that just isn't what these two engineering posts discuss. Independently confirmed via codex CLI, grok CLI, and direct fetches of all sources."
    limitations:
      - {value: Relies on the user approval model outside the sandbox.}
      - {value: Boundaries must be configured correctly.}

