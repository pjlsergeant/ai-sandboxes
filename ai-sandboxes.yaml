      basis: "Repo README documents mitmproxy allowlist enforcement (default models.dev) and TLS termination only. The originating HN comment (by the repo author) frames token injection as a want, not a delivered mechanism: \"What I would really want is token injection outside the sandbox and good control over the network, why I tried integrating a mitm proxy...\""

